<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PAGE MOVE</title>

    <script>
      const ua = navigator.userAgent;

      const isIOS =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isAndroid = /Android/i.test(ua);

      if (isAndroid) {
        window.location.replace(
          "https://play.google.com/store/apps/details?id=com.pagemove.passenger",
        );
      } else if (isIOS) {
        window.location.replace(
          "https://apps.apple.com/br/app/page-move/id6811351316",
        );
      } else {
        window.location.replace(
          "https://play.google.com/store/apps/details?id=com.pagemove.passenger",
        );
      }
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
